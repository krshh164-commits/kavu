<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kāvu visual QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #ecebe4; color: #263326; font: 14px/1.4 Arial, sans-serif; }
      main { display: grid; grid-template-columns: 1.2fr .8fr; gap: 28px; min-height: 100vh; padding: 28px; }
      section { display: flex; min-width: 0; flex-direction: column; gap: 12px; }
      h2 { margin: 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
      img, iframe { width: 100%; border: 0; border-radius: 18px; background: white; box-shadow: 0 16px 55px rgba(38,51,38,.12); }
      img { margin: auto 0; }
      iframe { height: calc(100vh - 78px); }
    </style>
  </head>
  <body>
    <main>
      <section><h2>Source palette and clay landscape</h2><img src="/reference-style.png" alt="Source landscape reference" /></section>
      <section><h2>Mobile WebGL interpretation</h2><iframe src="/" title="Kāvu meadow implementation"></iframe></section>
    </main>
  </body>
</html>
